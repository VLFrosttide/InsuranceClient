<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insurance - Login</title>
    <link rel="stylesheet" href="../app.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="AuthCard">
      <h1 data-i18n="brand">Insurance Console</h1>

      <form id="LoginForm" class="auth-form">
        <select id="BranchInput" class="FormInput">
          <label for="BranchInput" data-i18n="branch">Branch</label>
          <option value="ГКПП Капитан Андреево" selected>ГКПП Капитан Андреево</option>
          <option value="ГКПП Лесово">ГКПП Лесово</option>
          <option value="Офис Харманли">Офис Харманли</option>
        </select>
        <label for="UsernameInput" data-i18n="username">Username</label>
        <input id="UsernameInput" type="text" autocomplete="username" />
        <label for="PassInput" data-i18n="password">Password</label>
        <div class="row password-row">
          <input
            id="PassInput"
            type="password"
            autocomplete="current-password"
          />
          <!-- Eye button. The icon is injected from PASSWORD_EYE_ICON_SVG
               (common.js) and its masked/readable state is carried by
               aria-pressed, which .pw-toggle in app.css turns into the
               slash over the eye. logic.js keeps the state in sync. -->
          <button
            id="VisIcon"
            class="pw-toggle"
            type="button"
            aria-controls="PassInput"
            aria-pressed="false"
            aria-label="Show password"
            title="Show password"
          ></button>
        </div>
        <button id="SubmitButton" type="submit">
          <span id="LoginSpinner" class="login-spinner" aria-hidden="true"></span>
          <span id="SubmitLabel" data-i18n="login">Login</span>
        </button>
      </form>

      <!-- Phase of the current login attempt ("Signing in…", "Server unreachable
           — retrying… (2/3)", "Waiting for the server… (12 s)", "Login
           successful — loading…"). Filled in by logic.js while an attempt is in
           flight; kept empty (and hidden) when the form is idle. -->
      <div
        id="LoginProgress"
        class="login-progress"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        <span id="LoginProgressText"></span>
      </div>

      <div class="row lang-row">
        <div class="spacer"></div>
        <button id="LangButton" class="secondary" type="button">EN</button>
      </div>

      <div id="DisplayMsg" class="msg"></div>
      <div id="NetStatus" class="net-status checking"></div>
    </div>

    <script src="../common.js" defer></script>
    <script src="../netMonitor.js" defer></script>
    <script src="logic.js" defer></script>
  </body>
</html>
