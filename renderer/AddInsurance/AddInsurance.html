<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Insurance</title>
    <link rel="stylesheet" href="../app.css" />
    <link rel="stylesheet" href="AddInsurance.css" />
  </head>
  <body>
    <header id="PageHeader">
      <div class="row">
        <button
          id="BackButton"
          class="secondary"
          type="button"
          data-i18n="add.back"
        >
          ← Dashboard
        </button>
        <h1 data-i18n="add.title">Add Insurance</h1>
        <div class="spacer"></div>
        <button id="LangButton" class="secondary" type="button">BG</button>
      </div>
    </header>

    <div id="AddInsuranceLayout">
      <form id="InsuranceForm" autocomplete="off">
        <div class="form-grid">
          <div class="field">
            <label for="PolicyNumberInput" data-i18n="add.policyNumber"
              >Полица номер</label
            >
            <input
              id="PolicyNumberInput"
              class="NumInput FormInput ClearForm"
              type="text"
            />
          </div>
          <div class="field">
            <label for="BlancNumberInput" data-i18n="add.blancNumber"
              >Бланка номер</label
            >
            <input
              id="BlancNumberInput"
              class="NumInput FormInput ClearForm"
              type="number"
            />
          </div>
          <div class="field">
            <label for="CarNumberInput" data-i18n="add.carNumber"
              >Номер автомобил</label
            >
            <input
              id="CarNumberInput"
              class="FormInput ClearForm"
              type="text"
              required
            />
          </div>
          <div class="field">
            <label for="DurationInput" data-i18n="add.duration">Срок</label>
            <input
              id="DurationInput"
              class="NumInput FormInput ClearForm"
              type="text"
              placeholder="15"
            />
          </div>
          <div class="field">
            <label for="AutoTypeInput" data-i18n="add.vehicleType"
              >Otomobil</label
            >
            <select name="AutoType" id="AutoTypeInput" class="FormInput">
              <option value="Automobile">Автомобил</option>
              <option value="Motor">Мотор</option>
              <option value="Bus">Бус</option>
              <option value="Trailer">Ремарке</option>
            </select>
          </div>
          <div class="field">
            <label for="StartDateInput" data-i18n="add.startDate"
              >Начална дата</label
            >
            <input id="StartDateInput" class="FormInput" type="date" />
          </div>
          <div class="field">
            <label for="TotalPriceInput" data-i18n="add.price">Цена</label>
            <input
              id="TotalPriceInput"
              class="FormInput"
              type="number"
              step="0.01"
            />
          </div>
          <div class="field">
            <label for="CurrencyInput" data-i18n="add.currency">Валута</label>
            <select name="Currency" id="CurrencyInput" class="FormInput">
              <option value="EUR">EUR</option>
              <option value="USD">USD</option>
              <option value="TRY">TRY</option>
            </select>
          </div>
          <div class="field checkbox-field">
            <label>
              <input id="CashInput" class="FormInput" checked type="checkbox" />
              <span data-i18n="add.cash">В брой</span>
            </label>
          </div>
          <div class="field checkbox-field">
            <label>
              <input id="NonTurkInput" class="FormInput" type="checkbox" />
              <span data-i18n="add.nonTurk">Не-турчин (+5 €)</span>
            </label>
          </div>
          <div class="field checkbox-field">
            <label>
              <input
                id="CardFeeInput"
                class="FormInput"
                type="checkbox"
                disabled
              />
              <span data-i18n="add.cardFee">Такса плащане с карта (+2 €)</span>
            </label>
          </div>
        </div>

        <!-- Drop area for files that will be attached to the return email. -->
        <div id="DropArea" tabindex="0" role="button">
          <div class="drop-title" data-i18n="add.dropArea">
            Пуснете файлове тук
          </div>
          <div class="drop-hint" data-i18n="add.dropAreaHint">
            или щракнете, за да изберете файлове
          </div>
          <ul id="DroppedFiles"></ul>
        </div>
        <input id="FileInput" type="file" multiple hidden />

        <div class="test-checkbox-field">
          <label>
            <input id="DisableReturnEmailInput" type="checkbox" />
            <span data-i18n="add.testDisableEmail"
              >Тест (изключи обратния имейл)</span
            >
          </label>
        </div>

        <div id="DisplayMsg"></div>
        <div class="row actions-row">
          <button id="SubmitFormButton" type="submit" data-i18n="add.submit">
            Запиши
          </button>
          <button
            id="ClearButton"
            class="secondary"
            type="button"
            data-i18n="add.clear"
          >
            Изчисти
          </button>
        </div>

        <!-- Reply UI, shown only when the form was opened from an email card. -->
        <section id="ReplySection" class="hidden">
          <label for="ReplyInput" data-i18n="add.reply">Отговор</label>
          <input
            id="ReplyInput"
            type="text"
            data-i18n-placeholder="add.replyPlaceholder"
            placeholder="Въведете отговора си…"
          />
          <div class="row reply-actions">
            <button
              id="ReplyButton"
              class="reply-button"
              type="button"
              data-i18n="add.replyButton"
            >
              Изпрати отговор
            </button>
          </div>
        </section>
      </form>

      <aside id="EmailSide" class="hidden">
        <h2 id="EmailSideTitle"></h2>
        <div id="EmailSideBody"></div>
        <div class="email-side-actions">
          <button
            id="UnclaimButton"
            class="secondary"
            type="button"
            data-i18n="email.unclaim"
          >
            Освободи имейла
          </button>
        </div>
      </aside>
    </div>

    <!-- Zoomable / printable picture viewer. -->
    <div id="ImageViewer" class="hidden">
      <div class="viewer-toolbar">
        <button id="ViewerZoomOut" class="secondary" type="button">−</button>
        <button id="ViewerZoomIn" class="secondary" type="button">+</button>
        <button id="ViewerResetZoom" class="secondary" type="button">
          100%
        </button>
        <button id="ViewerPrint" type="button">🖨</button>
        <button id="ViewerClose" class="secondary" type="button">✕</button>
      </div>
      <div class="viewer-stage">
        <img id="ViewerImage" alt="" />
      </div>
    </div>

    <script src="../common.js" defer></script>
    <script src="AddInsurance.js" defer></script>
  </body>
</html>
