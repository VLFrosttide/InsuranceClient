<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Insurance</title>
    <link rel="stylesheet" href="../app.css" />
    <link rel="stylesheet" href="AddInsurance.css" />
  </head>
  <body>
    <header id="PageHeader">
      <div class="row">
        <button id="BackButton" class="secondary" type="button">
          ← Dashboard
        </button>
        <h1>Add Insurance</h1>
      </div>
    </header>

    <div id="AddInsuranceLayout">
      <form id="InsuranceForm" autocomplete="off">
        <div class="form-grid">
          <div class="field">
            <label for="DKNInput">ДКН</label>
            <input id="DKNInput" class="ClearForm FormInput" type="text" />
          </div>
          <div class="field">
            <label for="PolicyNumberInput">Полица номер</label>
            <input
              id="PolicyNumberInput"
              class="NumInput FormInput ClearForm"
              type="text"
            />
          </div>
          <div class="field">
            <label for="BlancNumberInput">Бланка номер</label>
            <input
              id="BlancNumberInput"
              class="NumInput FormInput ClearForm"
              type="number"
            />
          </div>
          <div class="field">
            <label for="DurationInput">Срок</label>
            <input
              id="DurationInput"
              class="NumInput FormInput ClearForm"
              type="text"
              placeholder="15"
            />
          </div>
          <div class="field">
            <label for="BrokerCodeInput">Код офис на брокер</label>
            <input id="BrokerCodeInput" class="FormInput" type="text" />
          </div>
          <div class="field">
            <label for="BranchInput">Клон</label>
            <input
              id="BranchInput"
              class="FormInput"
              type="text"
              placeholder="ГКПП Лесово"
            />
          </div>
          <div class="field">
            <label for="AutoTypeInput">Otomobil</label>
            <select name="AutoType" id="AutoTypeInput" class="FormInput">
              <option value="Otomobil">Otomobil</option>
            </select>
          </div>
          <div class="field">
            <label for="TotalPriceInput">Цена</label>
            <input
              id="TotalPriceInput"
              class="FormInput"
              type="number"
              step="0.01"
            />
          </div>
          <div class="field">
            <label for="CurrencyInput">Валута</label>
            <select name="Currency" id="CurrencyInput" class="FormInput">
              <option value="EUR">EUR</option>
              <option value="USD">USD</option>
              <option value="TRY">TRY</option>
            </select>
          </div>
          <div class="field">
            <label for="ClientNameInput">Име на клиент</label>
            <input
              id="ClientNameInput"
              class="ClearForm FormInput"
              type="text"
            />
          </div>
          <div class="field">
            <label for="ClientAdressInput">Адрес на клиент</label>
            <input
              id="ClientAdressInput"
              class="ClearForm FormInput"
              type="text"
            />
          </div>
          <div class="field">
            <label for="ChassisNumberInput">Шаси номер</label>
            <input
              id="ChassisNumberInput"
              class="ClearForm FormInput"
              type="text"
            />
          </div>
          <div class="field">
            <label for="VehicleBrandInput">Марка на прев. средство</label>
            <input id="VehicleBrandInput" class="FormInput" type="text" />
          </div>
          <div class="field">
            <label for="AgentInput">Агент</label>
            <input id="AgentInput" class="FormInput" type="text" />
          </div>
          <div class="field checkbox-field">
            <label>
              <input id="CashInput" class="FormInput" checked type="checkbox" />
              В брой
            </label>
          </div>
        </div>

        <div id="DisplayMsg"></div>
        <div class="row actions-row">
          <button id="SubmitFormButton" type="submit">Запиши</button>
          <button id="ClearButton" class="secondary" type="button">
            Изчисти
          </button>
        </div>
      </form>

      <aside id="EmailSide" class="hidden">
        <h2 id="EmailSideTitle"></h2>
        <div id="EmailSideBody"></div>
      </aside>
    </div>

    <script src="../common.js" defer></script>
    <script src="AddInsurance.js" defer></script>
  </body>
</html>
